<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login - mi pagina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="login-card">
    <h2>hola mi eskibidi papu</h2>

    <form action="index.html" method="post" id="formLogin" novalidate>
        <!-- numero de control -->
        <div class="mb-3">
            <label for="control" class="form-label">Numero de control</label>
            <input type="text"
                   class="form-control"
                   id="control"
                   name="control"
                   placeholder="ingresa tu numero de control we"
                   required>
        </div>

        <!-- contraseña -->
        <div class="mb-3">
            <label for="password" class="form-label">contraseña</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="ingresa tu contraseña"
                   minlength="8"
                   required>
        </div>

        <!-- boton ingresar -->
        <button type="submit" class="btn btn-primary btn-login w-100">
            ingresar
        </button>

        <!-- boton registrarse -->
        <div class="registro text-center mt-3">
            <p>¿No tienes una cuenta, pobre?</p>
            <a href="registro.html" class="btn btn-outline-success btn-login">
                registrarse
            </a>
        </div>
    </form>
</div>

<script src="login.js"></script>
</body>
</html>
