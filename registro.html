<html>
  
<form class="row g-3" action="login.html" method="post" id="formRegistro" novalidate>
  <div class="col-md-6">
    <label for="nombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="nombre" name="nombre" required>
  </div>

  <div class="col-md-6">
    <label for="paterno" class="form-label">Apellido paterno</label>
    <input type="text" class="form-control" id="paterno" name="paterno" placeholder="el apellido de tu papa we" required>
  </div>

  <div class="col-md-6">
    <label for="materno" class="form-label">Apellido materno</label>
    <input type="text" class="form-control" id="materno" name="materno" placeholder="el apellido de tu mama we">
  </div>

  <div class="col-md-6">
    <label for="control" class="form-label">Numero de control</label>
    <input type="text" class="form-control" id="control" name="control" placeholder="numerocontrol" required>
  </div>

  <div class="col-md-6">
    <label for="semestre" class="form-label">Semestre</label>
    <input type="text" class="form-control" id="semestre" name="semestre">
  </div>

  <div class="col-md-6">
    <label for="turno" class="form-label">Turno</label>
    <select id="turno" name="turno" class="form-control">
      <option selected>vespertino (zzz)</option>
      <option>matutino (god)</option>
    </select>
  </div>

  <div class="col-12">
    <label for="especialidad" class="form-label">Especialidad</label>
    <select id="especialidad" name="especialidad" class="form-control">
      <option selected>programacion (zzz)</option>
      <option>ventas (bodrio)</option>
      <option>gastronomia ($$$$$)</option>
    </select>
  </div>

  <div class="col-12">
    <label for="password" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="password" name="password" minlength="8" required>
  </div>

  <div class="col-12">
    <label for="confirmar" class="form-label">Confirmar contraseña</label>
    <input type="password" class="form-control" id="confirmar" name="confirmar" minlength="8" required>
  </div>

  <div class="col-12">
    <button type="submit" class="btn btn-success btn-login w-100">Registrarme</button>
  </div>

  <div class="col-12 text-center mt-3">
    <a href="login.html">¿Ya tienes cuenta?</a>
  </div>
</form>
<link rel="stylesheet" href="estilo.css">
<script src="registro.js"></script>
</body>

</html>
